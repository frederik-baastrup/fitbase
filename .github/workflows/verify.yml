name: Tjek SEO-tekst/FAQ (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tjek "Priser opdateret" på forsiden og i en kategori
        shell: bash
        run: |
          set +e
          {
            date -u +"Kørt (UTC): %F %T"
            for u in "https://fitbase.dk/" "https://fitbase.dk/traeningsmaskiner/lobebaand/"; do
              curl -sS -D h.txt -o p.html -m 30 -A "Mozilla/5.0 (verify)" "$u"
              echo "$u -> $(head -1 h.txt | tr -d '\r') $(grep -i '^sg-captcha\|^x-proxy-cache\|^age' h.txt | tr -d '\r' | tr '\n' ' ')"
              grep -o -i 'Priser opdateret[^<]*' p.html | head -2
            done
          } > resultat.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        shell: bash
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B verify-result
          git add resultat.txt
          git commit -m "Verify-resultat" --allow-empty
          git push -f origin verify-result
