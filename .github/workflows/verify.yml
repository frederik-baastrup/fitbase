name: Tjek SEO-tekst/FAQ (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find tømmemetode der virker
        shell: bash
        run: |
          set +e
          U="https://fitbase.dk/traeningsmaskiner/lobebaand/gaabaand/"
          {
            echo "start: $(date -u +%T)"
            curl -sS -D h.txt -o /dev/null -m 120 "https://fitbase.dk/wp-json/?pf_deploy=probe-$RANDOM&pf_probe=$U"
            grep -i "^HTTP\|x-pf-" h.txt
            echo "--- bagefter, udefra:"
            curl -sS -D h2.txt -o p.html -m 30 "$U"; head -12 h2.txt; echo -n "ny-værktøjslinje="; grep -c results__n p.html; head -c 300 p.html
          } > resultat.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        shell: bash
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B verify-result
          git add resultat.txt
          git commit -m "Verify-resultat" --allow-empty
          git push -f origin verify-result
