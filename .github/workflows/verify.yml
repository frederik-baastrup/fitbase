name: Tjek SEO-tekst/FAQ (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tjek cache og ny kode
        shell: bash
        run: |
          set +e
          H="https://fitbase.dk"
          {
            for u in "$H/traeningsmaskiner/lobebaand/gaabaand/" "$H/traeningsmaskiner/lobebaand/gaabaand/?nocache=$RANDOM" "$H/"; do
              echo "== $u =="
              curl -sS -D headers.txt -o page.html -m 30 "$u"
              grep -i "^HTTP\|cache\|age:\|x-proxy\|sg-\|last-modified\|date:" headers.txt
              echo -n "css-version: "; grep -o "main.css?ver=[0-9.]*" page.html | head -1
              echo -n "results__n (ny værktøjslinje): "; grep -c "results__n" page.html
              echo -n "filterbtn (ny knap): "; grep -c "data-filter-btn" page.html
              echo -n "Reklamelinks (ny topbar): "; grep -c "Reklamelinks" page.html
              echo
            done
          } > resultat.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        shell: bash
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B verify-result
          git add resultat.txt
          git commit -m "Verify-resultat" --allow-empty
          git push -f origin verify-result
