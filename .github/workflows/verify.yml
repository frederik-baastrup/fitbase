name: Tjek SEO-tekst/FAQ (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tjek forside og kategori (ét kald hver)
        shell: bash
        run: |
          set +e
          {
            for u in "https://fitbase.dk/" "https://fitbase.dk/traeningsmaskiner/lobebaand/"; do
              curl -sS -D h.txt -o p.html -m 30 "$u"
              css=$(grep -o 'https://fitbase.dk/wp-content/themes/playform/assets/css/main.css?ver=[0-9.]*' p.html | head -1)
              echo "$u -> $(head -1 h.txt | tr -d '\r') $(grep -i '^x-proxy-cache:\|^sg-captcha\|^cache-control' h.txt | tr -d '\r' | tr '\n' ' ') css=$css"
              if [ -n "$css" ]; then
                curl -sS -m 30 -o m.css "$css"
                echo "  css-bytes=$(wc -c < m.css) topbar-rule=$(grep -c 'Reklamelinks venstrestillet' m.css) footer-rule=$(grep -c 'Footer på mobil' m.css) rel-rule=$(grep -c 'Kig videre' m.css)"
              fi
            done
          } > resultat.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        shell: bash
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B verify-result
          git add resultat.txt
          git commit -m "Verify-resultat" --allow-empty
          git push -f origin verify-result
