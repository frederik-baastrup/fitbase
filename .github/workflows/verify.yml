name: Tjek SEO-tekst/FAQ (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tjek cache og ny kode (venter op til 6 min på frisk side)
        shell: bash
        run: |
          set +e
          U="https://fitbase.dk/traeningsmaskiner/lobebaand/gaabaand/"
          {
            echo "start: $(date -u +%T)"
            for i in $(seq 1 18); do
              curl -sS -D headers.txt -o page.html -m 30 "$U"
              st=$(grep -i "^x-proxy-cache:" headers.txt | tr -d '\r')
              n=$(grep -c "results__n" page.html)
              echo "$(date -u +%T)  $st  ny-værktøjslinje=$n  $(grep -o 'main.css?ver=[0-9.]*' page.html | head -1)"
              [ "$n" -ge 1 ] && break
              sleep 20
            done
          } > resultat.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        shell: bash
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B verify-result
          git add resultat.txt
          git commit -m "Verify-resultat" --allow-empty
          git push -f origin verify-result
