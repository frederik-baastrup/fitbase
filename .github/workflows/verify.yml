name: Tjek SEO-tekst/FAQ (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tjek forside og kategori (ét kald hver)
        shell: bash
        run: |
          set +e
          {
            for u in "https://fitbase.dk/" "https://fitbase.dk/traeningsmaskiner/lobebaand/gaabaand/"; do
              curl -sS -D h.txt -o p.html -m 30 "$u"
              echo "$u -> $(head -1 h.txt | tr -d '\r') $(grep -i '^x-proxy-cache:\|^sg-captcha' h.txt | tr -d '\r' | tr '\n' ' ') $(grep -o 'main.css?ver=[0-9.]*' p.html | head -1)"
            done
          } > resultat.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        shell: bash
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B verify-result
          git add resultat.txt
          git commit -m "Verify-resultat" --allow-empty
          git push -f origin verify-result
